[project]
name = "sona_backend"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "huggingface_hub>=0.36,<1",
    "httpx>=0.27",
    "msgpack>=1.0",
    "av>=14",
    "numpy>=1.26",
    "opencc-python-reimplemented>=0.1.7",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sona_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
